[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petab-mcp"
version = "0.1.0"
description = "A local MCP server for interactively editing a PEtab (v1) model/parameters and scoring against fixed data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fabian Fröhlich" }]
keywords = ["petab", "mcp", "systems-biology", "sbml", "parameter-estimation", "amici"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The simulation stack (AMICI + pyPESTO) is a hard requirement: fitting and simulation
# run automatically on every model commit, so the server assumes they are present.
# Installing therefore needs a C++ toolchain, CMake/Ninja, and swig (see README).
dependencies = [
    "mcp>=1.2",
    "petab>=0.5",
    "python-libsbml>=5.19",
    "antimony>=2.12",
    "pandas>=1.5",
    "numpy>=1.23",
    "duckdb>=0.9",
    "h5py>=3",
    "pydantic>=2",
    "sympy>=1.10",
    "amici>=0.30",
    "pypesto[petab]>=0.5",
    "fides>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
petab-mcp = "petab_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ffroehlich/petab_mcp"
Repository = "https://github.com/ffroehlich/petab_mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/petab_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/petab_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
