[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemot"
version = "0.1.0"
description = "An LLM agent panel, and its judge, that builds mechanistic models through the petab-mcp server."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabian Fröhlich" }]
keywords = ["petab", "mcp", "systems-biology", "sbml", "parameter-estimation", "amici"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # The server this harness drives, from PyPI. Pinned to one release so a checkout here names the
    # server it was tested against: bump it deliberately, and see the README for developing both at
    # once. A server fix gemot needs before it is released goes in the `pins` group by commit
    # (`petab-mcp @ git+https://github.com/frohlich-lab/PEtab-MCP.git@<sha>`) until the next
    # release, never here: PyPI refuses a direct reference in a package's metadata.
    # PEtab-MCP main (4024358), with frohlich-lab/PEtab-MCP#49: held-out sets are PEtab v2 only,
    # so `read_held_out` refuses a v1 set and `validation_data.as_v2` is gone. PEtabAgentBench
    # converts each problem's training and held-out sets together and ships both as v2. #81: AMICI
    # at AMICI-dev/AMICI#3408, whose JAX code compiles for `And`/`Or` (the `neural` extra below).
    # #73: the server reads the AMICI tolerances `Scenario.amici_tolerances` exports. #82: AMICI at
    # #3408's merge commit. Then 73c4858: #97: the panel reads the server's own tool
    # descriptions, and `statements_only` for the indra_statements arm. #88: a pass with no fit
    # scores the table's sigmas and scalings, so the null is scored as delivered. #95: a full disk
    # ends the call as `infrastructure_error: disk_full`, which the runner stops on. #104: a rate
    # law's local parameters become global ones with a row, so the null's reconcile charges them.
    # #100: under tic, k_eff charges hardcoded constants. #101: replicate lack-of-fit judged against
    # the scatter pooled over each noise sigma. #107: each AMICI's modules build in a folder of their
    # own. #106: `piecewise` in a written rate. Also #89–#94. Then cdc68cc: #117: a fit
    # whose starts stop finishing ends by a deadline, and a change while one is fitted is refused
    # as `fit_in_progress`, the code the circuit breaker matches (gemot#59). #111: a chain grows
    # only through a molecule bound while bound. #113: a readout that is a number is not refused.
    # #114: the statements route says what to write in five of its rejections. Then cb263c1:
    # #133: pyPESTO at main 053079a (with ICB-DCM/pyPESTO#1786) and fides >= 0.8.1. #121: a start
    # stuck past its cap is stopped and scored as failed, the fit from the rest. #120: a held-out
    # score writes its per-point records to the head version's `validation_simulations.json`, which
    # the run archive keeps. #123/#124/#127/#128: a statement states its regulators (`inhibited_by`,
    # `activated_by`, `modulated_by`), recorded as the kind its rate shows, and projects them onto
    # INDRA statements; `modifiers` are gone. #115/#116: exact reductions of multisite statement
    # models. #132: the reconcile simulates the model as authored.
    # Then 44475a7: #135: a row's binding is given apart from its statement,
    # `bindings={prefix: ...}`, as gemot#65's prompt asks; the inline `| policy` form is refused.
    # #136/#147: causal constraints held on every change, off unless the server is started with
    # them. #137: agents are matched by name, not grounding. #138: a gate's comparison stays in
    # the net rate. #139: a condition target INDRA renames is held. #140: a scheme binds a
    # stated regulator as a molecule. #141: `is_new_best` is the checkpoint's decision, and a
    # declined fit says why in `new_best_declined`. #142: `restore_version` says HEAD moves.
    # #143: a rate reading an amount no species forms is refused. #144-#146, #160, #161:
    # entity-map, regulator and corpus fixes. #162: an active-form constraint reads INDRA's
    # activity types, which #161 left in place of notation's. Then a32a1f6: #169: a server offers
    # the `statements` route or the text routes, never both; an entity map implies the former, and
    # `statements_only` is gone. #163: an offset in an observable formula is solved as an inner
    # offset, not a second scaling, so a problem with both fits them hierarchically again.
    # Then 0da8743: #170: a provenance store keeps each fit's values once, in compact JSON.
    # #181: fastmcp 4, so the mcp 2.0 SDK, which `mcp` below moves with. #183: python-dateutil < 3.
    # #175: the read tools answer small unless asked (`get_version(include=["simulation"])`,
    # `get_model_structure(reactions="")`), and a version's meta records its `k`. #173/#174: a
    # constraint on a species the model lacks says what adds it; an unnamed start is named after
    # its form. #184: the statements route's species at t = 0 are `seeds` (`set_seed`,
    # `remove_seed`, a record's `"seeds"`), not `starts`, with no alias. #186: amici >= 1.2.0 and
    # petab >= 0.10.0 instead of git pins, which the floors below and the `neural` extra follow.
    # Then a576b52: #198: the fixed tables are listed as TSV, conditions one row per
    # condition and one column per target, and `list_mechanisms` without `statement_types` is an
    # index. #199: a seed at a condition target's id alone makes its agent that input, and an input
    # read only at the start warns. #200, #211: a `make_changes` result carries only what is flagged
    # or new since the parent (pins, flagged sigmas, `merge_hints` beside `n_merge_hints`) and the
    # moving part of `improvement` and `progress`; `get_fit_summary` keeps all of it. #197: an
    # estimated-sigma model is never adequate for the plateau stop, so it ends at the streak cap.
    # #202: `parameters` or `n_starts` alone refit a version. #203, #212: `get_fit_diagnosis` ranks
    # where an estimated sigma absorbed a misfit, and the fit result names the sigmas a
    # heterogeneity test points at. #204, #209, #210: a statements refusal names its fix, and the
    # `statements-grammar` skill is listed only on the statements route, `antimony-authoring` only
    # on the text routes.
    # Then 26e5b76, main: #215: a fit result carries `starts_at_best` (within 1 nll, the margin
    # the explorer's `n_at_best` follows), and warns when most starts run out of the per-start time
    # limit. #214: an edit names the species it prunes, and a condition target nothing reads warns.
    # Then 082d34e, main: #177: `wait_for_fit`, which the judge calls before scoring (gemot#73,
    # #79). #245: `get_progress` and `get_run_timing` answer at once during a fit. #224: every call
    # sends a heartbeat, and `get_run_timing` reports `queue_seconds`. #225: `petab-mcp-pool` runs
    # a fit pool, and `create_server(cluster=ADDRESS)` joins it (the `pool` extra below,
    # runner/server.py). #226, #244: a pool from another environment is refused, and a lost pool
    # ends the call as `infrastructure_error: fit_pool` until it is back at its address. #241:
    # `distributed>=2023.12.0`, so a server joining a pool re-sends nothing to its workers.
    # #221, #240: a build another server holds is waited for, across nodes. #222: AMICI needs no
    # HDF5 to send a start to a worker (CI). #243: a sigma whose noise formula names another
    # estimated parameter is `scale_coupled` (gemot#104, #109). #242: a new best with an inflated
    # sigma resets the non-improving streak. #188: the per-start cap is the session's. #229: local
    # workers start by forkserver. #235: `get_version` summarises a part past the client's 1 MiB
    # event limit. #230, #236: `statements-grammar` covers each verb, tag and edit, and an edit
    # names a catalyst taken in every state and the readouts no input reaches. #234: pyPESTO
    # >= 0.8.0. #223, #233, #239: the pool's scheduler stress check. #249: no condition target
    # is held: each period sets an ordinary species, and a dose in excess is bound
    # `nondepleting`. #248: a residual flag gates no stop and claims no missing form (gemot#102).
    # Then 74f398e, main: #255: a statements refusal names the row, the sites and the ids to send,
    # and `set_seed` is flat (`agent`, `amount`, `name` beside `op`; a nested `seed` is refused).
    # #257: a Conversion to nothing under `indra_default` is refused, not crashed. #256: a pool
    # runs a fixed number of worker jobs, with no adapt. #254: a fit with idle pool workers is
    # spread over them, and a task is sized at the 90th-percentile start.
    # Then ba49253, main: #258: AMICI simulates a fit's experiments on
    # `PETAB_MCP_FIT_AMICI_N_THREADS` threads, default 1, which `fit_budget.server_fit_settings`
    # records.
    # Then 9732ddf, main: frohlich-lab/PEtab-MCP#259: the plateau gate calls a fixed-sigma model
    # adequate at chi2 p >= 0.1, the level of `scenario.REFERENCE_FREE_GOF_ALPHA`, so it no longer
    # stops a run the judge then fails.
    # Then 8c06ba0, main: frohlich-lab/PEtab-MCP#260: petab at PEtab-dev/libpetab-python#579, which
    # keeps per-experiment constants in the condition table; without it froehlich does not import.
    # Then 488bb89, main: #276: the nesting advisory flags an INVALID COMPARISON only for a child
    # nested in its parent; a removed or rewritten reaction or rule reads "not nested" and is not
    # flagged (agent/finish_gate.py's note follows). #275: `get_fit_diagnosis` takes a version.
    # #274: a bound on an inner-solved sigma is refused, and a fit that passes goodness-of-fit by
    # construction says so. #273: the widening guard counts bounds-only steps along parents and
    # never blocks a loss. #272: a species rate laws read that stays 0 is warned about. #277: an
    # all-failed fit names the expression AMICI found not finite. #279: a fit is re-scored with its
    # gradient, and unscored where that does not reproduce it. #262, #278: an edit names a whole
    # statement given to `set_assignment`/`set_rate_law`, and a parent's species, rule or reaction
    # it minted as a parameter.
    # Then 082938a, main: #280: a fit's problem leaves the server for the dask pool once, as a
    # file under the build root, not pickled with every start (froehlich's is about 0.45 GiB).
    # Then 6dbfad8, main, from the 2026-11-08 sweep's review: #304: the best version is the strict
    # minimum of the criterion, as the judge takes it; 2.0 only resets the non-improving streak.
    # #293: a one-sided bound edit keeps the other side, and is refused only when the box would
    # invert (`runner/clock.py`'s bounds bucket follows). #295: the streak-cap nudge claims only
    # what a streak shows (gemot#134). #299: an error or hint names only the tool that failed
    # and its companions (#291, from gemot#133). #303: n_starts is capped at 10x the run's default. #305: a failed
    # fit names its cause. #306: a widening refusal advises by the parameter's role. #298:
    # `query_data` serves `state_trajectories`. #296, #301, #302: minted parameters are named,
    # merge hints offer only ties an edit can make, and a rename keeps its fitted value. #300:
    # a transfer refit whose optimum does not simulate is `non_finite`. #294, #297, #307, #309:
    # `describe_problem` and wide tables are summarised.
    # Then 92133c8, main: #313: every version's meta keeps its edit's and lint's warnings whole, as
    # `edit_warnings`, which `get_version` returns; a result folds a repeated one to a line (#296).
    # gemot reads nothing of it yet (#286 item 4). #311, #312: CI and tests only.
    # Then b5c9b35, main: #314: `create_server(fix_pointers=False)` withholds the numbers that point
    # at what to change or where the fit is off; the bootstrap passes it on every launch (the
    # fix_pointers arm).
    # Then 7ffb364, main: #316: `create_server(progress_signals=False)` withholds the numbers that
    # rank, compare or judge a fit; the bootstrap passes it on every launch (the progress_signals arm).
    # Then 0.1.0 from PyPI, which is main at ced6cb1 (#318-#370, from the 2026-11 trace review).
    # #353: a merge hint's price is an estimate, stamped with `priced_at_version`, and a re-priced
    # hint is listed again; gemot's texts say "estimated" and point at `get_fit_summary`, which
    # serves every standing tie. #354: the noise-sigma advice names every flagged sigma and says
    # when no model can meet the cap, so the finish gate's refusal no longer adds "fix the model
    # FORM". #356: 100 is free only as the factor of a whole readout, and the FIM rank and flat
    # directions skip pinned parameters. #344: the 0/1 convention holds only a direct start, so
    # the null's scoring charges the factors of a compound one. #349: `query_data` columns are
    # snake_case (gemot#176 follows). #351, #352, #360, #366: new refusal causes for
    # `edit_rejects`, and #366's `pin` op.
    # #370: the server's git pins leave its published metadata (below). The rest change texts and
    # fields gemot does not read.
    # Then 0.1.1 from PyPI (v0.1.1, 948eb52). #374: a noise sigma is judged against its data's
    # replicate pure error where there are replicates (cap raised to 1.5x it, collapsed only below
    # 0.5x it, never without replicates), PEtab-MCP#320's rule; the judge and finish gate read the
    # server's flags, so only the dead `NOISE_SIGMA_COLLAPSE_FRACTION` import and the tests that
    # built collapse from it follow. #372: pysb, INDRA and BioNetGen are the `statements` extra; the
    # indra_statements arm starts its server with an entity map, which the server refuses without
    # them, so gemot's `statements` extra asks for it (below). #371: the design notes are in
    # docs/DESIGN.md. The server's two git pins (petab, pysb) are commits, which PyPI refuses in a
    # package's metadata: they are in the `pins` dependency group at the end of this file.
    "petab-mcp==0.1.1",
    # The MCP *client* (runner/*, bio_sessions) and, under the `agent` extra's tool bridge, the
    # session that bridge calls through (agent/mcp_tools.py). 2.x because the server's fastmcp 4
    # is built on it; 2.3 is the first release fastmcp 4.1 accepts. What 2.0 changed for the code
    # here: `streamable_http_client` takes an httpx2 client instead of timeouts; `read_timeout_seconds`
    # is a float of seconds; `McpError` is `MCPError`; result and tool fields are snake_case
    # (`structured_content`, `is_error`, `input_schema`), and the camelCase attributes are gone,
    # not deprecated. Capped below 3, the next break of that API; revisit when mcp 3 ships.
    "mcp>=2.3,<3",
    # Imported directly: runner.main and bio_sessions build the client the MCP transport runs on,
    # and the circuit breaker and the run loop's resume classify its TransportError. httpx2, not
    # httpx: mcp 2 runs on it, and its errors do not derive from httpx's. 2.10 is mcp 2.3's floor.
    "httpx2>=2.10",
    # Native Codex/Claude runs connect to an in-process loopback MCP gateway. Import uvicorn
    # directly for that gateway instead of relying on the MCP server's transitive dependency.
    "uvicorn>=0.23",
    # Imported directly here too (judge, simulate, the neural route), or promised to the
    # barebones agent's sandbox (pyPESTO, which its prompt tells the agent to fit with), so named
    # rather than left to arrive through petab-mcp, whose pyproject says why each floor. petab's
    # commit for Froehlich_CellSystems2018 is in the `pins` group.
    "petab>=0.10.0",
    "python-libsbml>=5.19",
    "antimony>=3.2",
    "pandas>=1.5",
    "numpy>=1.23",
    "duckdb>=0.9",
    "sympy>=1.10",
    "scipy>=1.10",
    "amici>=1.2.0",
    "pypesto[petab]>=0.5",
    "fides>=0.8.1",
    # Promised to the barebones agent's sandbox by name (BAREBONES_SYSTEM_PROMPT_TMPL), and
    # nothing above brings it. 1.4.2 is the first release built against NumPy 2; an older one
    # fails to import beside the numpy 2 this environment resolves.
    "scikit-learn>=1.4.2",
]

[project.optional-dependencies]
# Includes the agent stack: the harness tests drive the REAL deepagents/langchain graph (with a
# scripted fake chat model -- no network, no MCP server), and every one of them is guarded by an
# importorskip. Without these, `pip install -e '.[dev]' && pytest` silently SKIPS ~20 tests and
# reports green, which is how a broken _trim_europepmc_search and an uncurated `general-purpose`
# subagent (issue frohlich-lab/petab_mcp#112) each stayed invisible. The Phoenix UI/server and
# W&B are deliberately NOT pulled in -- no test touches them, and they are much heavier than the
# driver. The span exporter (`tracing`) is: the same skip hid that arize-phoenix-otel 0.17 had
# turned the trace-size stripping off for every run.
dev = [
    "pytest>=7", "pytest-asyncio>=0.23", "pytest-xdist>=3",
    # The linter CI runs (`ruff check .`, config in [tool.ruff] below). Floored at 0.6 -- the
    # version the rule set was selected against. Left UNCAPPED deliberately: a new ruff CAN add
    # rules inside the E/F/W families we select, but the resulting failure is a handful of local
    # fixes, which is cheaper than an upper bound nobody remembers to raise. If a version bump
    # ever lands a rule that is wrong FOR THIS REPO, add it to `ignore` with the reason -- do not
    # cap ruff. CI installs ruff on its own (it needs no C++ toolchain), so this pin exists so a
    # developer runs the same check locally.
    "ruff>=0.6",
    # The tests that drive the server in-process connect through fastmcp's own `Client`
    # (test_tool_descriptions, test_diagnosis_never_compiles). Both bounds are the server's:
    # petab-mcp pins `fastmcp>=4,<5`.
    "fastmcp>=4,<5",
    # tests/test_sweep.py builds the fit pool's worker job script from the settings its service job
    # exports, as the pool's own dask-jobqueue will (gemot.sweep). The floor is the server's `dask`
    # extra's: below 0.8.5 every sbatch the pool runs blocks its scheduler (dask/dask-jobqueue#610).
    "dask-jobqueue>=0.8.5",
    "gemot[agent]",
    "gemot[neural]",
    "gemot[pool]",
    "gemot[statements]",
    "gemot[tracing]",
]

# The indra_statements arm: its server is started with an entity map, which the server refuses
# without pysb, INDRA and BioNetGen (PEtab-MCP#372). No released pysb installs beside AMICI
# (1.17.0 caps `sympy<1.12`, amici 1.2.0 needs `sympy>=1.12.1`), so this extra resolves only with
# the `pins` group's pysb commit, or with that commit named on the command line (README).
statements = ["petab-mcp[statements]==0.1.1"]

# Fitting on a sweep's fit pool (`PETAB_MCP_FIT_POOL`, runner/server.py): the server's `dask`
# extra, which brings the dask client its `DaskEngine` joins the pool with, and `petab-mcp-pool`,
# which runs the pool. A pool must run from the same environment as the servers that join it, or
# they refuse it at connect (PEtab-MCP#226), so one install provides both. No URL: the version is
# the pin above. Split out so `harness`, which a sweep installs, and `dev`, whose pool test needs
# it, share one line.
pool = ["petab-mcp[dask]"]

# The deepagents driver stack: what the analyst panel actually runs on, and the only part of the
# harness the test suite exercises. Split out from `harness` so `dev` can depend on exactly this
# much, and so the version pins have ONE home.
# The neural-ODE route (`gemot.neural_ode`): a PEtab problem restated as a PEtab SciML
# neural ODE and trained through AMICI's JAX backend. `amici[jax]` brings jax, diffrax, equinox
# and optimistix at the versions AMICI is tested against; optax is the optimiser the training
# loop runs; petab-sciml writes the network definition and its initial weights in the standard's
# own formats. None of this is imported by the server or the panel.
neural = [
    # petab-mcp's floor (PEtab-MCP#186), from the index: 1.2.0 holds the AMICI#3408 commit
    # (a4dbb08) this extra used to pin by URL, whose JAX code compiles for `And`/`Or`. An sdist,
    # so it is built from source.
    "amici[jax]>=1.2.0",
    "optax>=0.2",
    # The curriculum multiple shooting rewrite (`petab_sciml.training`) is unreleased,
    # PEtab-dev/petab_sciml#92; its commit is in the `pins` group. Raise this floor to the release
    # that holds it (0.0.4) and drop the pin.
    "petab-sciml>=0.0.3",
]

agent = [
    # deepagents 0.7.x runs on the langchain 1.x line (0.7.32: langchain 1.4, langchain-core 1.7,
    # langgraph 1.2), so langchain-openai must also be on 1.x. EXACT because its patch releases
    # change what the panel does, not just how: 0.7.1 -> 0.7.32 added a node to every graph
    # (`_ParentNotifierMiddleware`, see tests/test_tracing_span_inputs.py), made the `task` tool
    # refuse arguments it used to drop (see `_task_arg_guard`), and compacts once the input
    # passes 0.95 x the window minus `max_tokens` (see the profile in agent/driver.py).
    # create_deep_agent still exposes the `system_prompt` / `name` / `subagents` / `middleware` /
    # `checkpointer` kwargs the driver adapts to, and the SubAgent spec + HarnessProfile
    # containment APIs (agent/subagents.py) are unchanged.
    "deepagents==0.7.32",
    # The MCP<->langchain bridge: LangChain's own `langchain.mcp` (`as_langchain_tool`, through
    # agent/mcp_tools.py), the successor of the archived langchain-mcp-adapters. The `mcp` extra
    # brings the fastmcp it imports, which deepagents does not. 1.4.7 is what deepagents above
    # needs anyway (`langchain.mcp` arrived in 1.4.0). It is a BETA namespace, and the bridge hands
    # it an mcp session where it expects a fastmcp client (agent/mcp_tools.py says why), so a
    # langchain release that changes what it reads off that client fails
    # tests/test_mcp_tools.py rather than a sweep.
    "langchain[mcp]>=1.4.7,<2",
    "langchain-openai>=1.3,<2",
]

# The agent harness (`gemot`): the deepagents driver every example's run.py drives,
# plus Phoenix tracing and W&B metrics logging. NOT needed for `--driver scripted` (the
# no-LLM harness self-test), which needs only the petab-mcp server itself, nor for
# regenerating an example's synthetic data (generate_data.py needs only amici + petab,
# which the server install already provides).
#
# Reaching a model also needs an OpenRouter API key:
#     export OPENROUTER_API_KEY=sk-or-...      # https://openrouter.ai/keys
harness = [
    "gemot[agent]",
    "gemot[pool]",
    # Arize Phoenix agent tracing (ON by default; disable at runtime with --no-phoenix).
    # Traces every LLM + MCP tool call the agent makes as OpenTelemetry spans viewable in the
    # Phoenix UI. The `tracing` extra EXPORTS the spans; the full `arize-phoenix` package
    # provides the local in-process UI the runner launches when no PHOENIX_COLLECTOR_ENDPOINT is
    # set, and it provides the run_experiment / Datasets / Prompt-registry API that
    # gemot_iclr_2026's scripts/run_experiments.py uses.
    # Floored at 21.0: nothing older installs beside mcp 2 (below 20.7 it needs fastmcp 3, so
    # mcp 1.x), and 21.0 is what the span stripping (see `tracing`) and the shared collector's
    # start (gemot_iclr_2026#386) were checked against. 21.0's MIGRATION.md changes how a SERVER
    # starts, not what this package calls: `phoenix serve --host` is gone (PHOENIX_HOST instead),
    # and a server bound to a non-loopback address -- the shared sweep collector,
    # gemot_iclr_2026's slurm/phoenix_server.sh -- turns authentication on unless
    # PHOENIX_ENABLE_AUTH=false, after which every exporter needs PHOENIX_API_KEY. The in-process
    # `launch_app` binds loopback, so it stays unauthenticated.
    # Capped below 22 for that reason: a major release changed the collector's defaults, and a
    # sweep would have seen it only as a 401 on every span export, which array_task.sh's probe
    # counts as a live collector. Revisit when 22 ships: read its MIGRATION.md against
    # slurm/phoenix_server.sh and this package's exporter (tracing.py).
    "arize-phoenix>=21.0,<22",
    "gemot[tracing]",
    # Weights & Biases metrics logging for the model x temperature sweep (opt-in via run.py
    # --wandb). Cluster-friendly alternative analysis UI to Phoenix Experiments; logs one
    # small W&B run per (example x model x temperature x repeat) with the judge outcome.
    # Credentials via `wandb login` (~/.netrc); `WANDB_MODE=offline` + `wandb sync` survives
    # an egress-restricted cluster.
    "wandb>=0.18",
]

# What `gemot.tracing` exports spans with: Phoenix's OTel provider and the LangChain
# instrumentor, without the Phoenix server. Split out from `harness` so `dev` can depend on
# exactly this much, and so the pins have ONE home. arize-phoenix-otel's floor is the oldest
# release the input stripping was checked against (0.16.1, the flag form of the provider's
# `_default_processor`; 0.17 holds the processor there, which tests/test_tracing_span_inputs.py
# runs against in CI). Last checked end to end -- a deepagents graph traced into a live Phoenix,
# its spans read back -- on arize-phoenix-otel 0.17.2, openinference-instrumentation-langchain
# 0.1.81 and deepagents 0.7.32.
tracing = [
    "arize-phoenix-otel>=0.16",
    "openinference-instrumentation-langchain>=0.1",
]

# The blinded bio-knowledge analyst (`biocurator`) needs NO extra dependency here: it reaches
# the hardcoded bio-knowledge MCP endpoints (gemot.runner.endpoints.BIO_MCP_URLS) over
# streamable-HTTP with the langchain-mcp-adapters / mcp client already pinned above.

# Run-explorer web UI (gemot_iclr_2026's scripts/explore_ui.py): serves the archived runs + Phoenix trace.
# The Phoenix client it reads traces through ships with the `harness` extra above; these are
# just the web-serving deps.
explorer = ["fastapi>=0.110", "uvicorn>=0.23", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/frohlich-lab/gemot"
Repository = "https://github.com/frohlich-lab/gemot"

[dependency-groups]
# Unreleased commits PyPI refuses as dependencies, so they are not in the published metadata.
# Install them from a checkout with `pip install -e '.[dev]' --group pins` (pip >= 25.1). With no
# `allow-direct-references`, hatchling refuses the build if a direct reference comes back into
# `dependencies` or an extra. Drop each line once its release is out.
pins = [
    # PEtab-dev/libpetab-python#579 (open): per-experiment constants stay in the condition table,
    # without which Froehlich_CellSystems2018 does not import. The server's pin too (PEtab-MCP#370).
    "petab @ git+https://github.com/PEtab-dev/libpetab-python.git@08a13908b060dd605df09f3a58c65ac01464520b",
    # pysb/pysb#611 (merged, unreleased), for the `statements` extra: see the comment there.
    "pysb @ git+https://github.com/pysb/pysb.git@9fc6bcb118683ad851e0a4d5604abe646f77cae3",
    # PEtab-dev/petab_sciml#92, the `neural` extra's training rewrite, at GitHub's test-merge
    # commit: the branch alone predates `petab_sciml.constants`, which petab's SciML lint imports.
    "petab-sciml @ git+https://github.com/PEtab-dev/petab_sciml@08498527900fd6e9de4818df65bde244ad887c86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gemot"]

[tool.hatch.build.targets.sdist]
include = ["src/gemot", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# NO `-n` here, deliberately. Parallelism is requested by the CALLER (`.github/workflows/ci.yml`
# passes `-n 2` for the 2-core runner) rather than baked into every invocation, because in addopts
# it cost more than it bought locally: it made pytest-xdist a HARD dependency (bare `pytest` exits
# 4 on the unrecognised argument before collecting anything), it breaks `--pdb`, and it made even
# `pytest tests/test_model_edits.py` spawn two workers.
#
# That last one is the expensive part, and the reason the scaling is poor in general: 8 workers cut
# the full suite from 662s to 306s, only 2.2x. `conftest.amici_build_root` is session-scoped, so
# ONE AMICI build root is shared and the toy model compiles once (~60-90s) -- but under xdist each
# worker is its own process with its own root, so that compile is paid PER WORKER and eats most of
# what the parallelism buys. Raising the worker count mostly buys more compiles; a single-file
# debug run paid it twice for no parallelism at all. Making it scale means sharing one root across
# workers behind a file lock, which is a real change, not a flag.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately NARROW. This linter was configured onto a ~53k-line codebase that had never run
# one, so the rule set is what the code ALREADY satisfies (plus the ~20 real defects fixed in the
# same change) rather than what a greenfield project would pick. Widening is a separate change per
# family, each with its own diff -- see docs/STYLE_GUIDE.md for the ones deliberately left out
# (`I`, `UP`, `BLE`).
select = ["E", "F", "W"]
ignore = [
    # Line length is a ~100-col TARGET, not a gate. ~340 lines in `src/` exceed it and nearly all
    # of them are the rationale comments that carry this repo's institutional memory; reflowing
    # them would churn `git blame` across every module to buy nothing. Write to 100 anyway.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Package facades. `gemot/agent/__init__.py` re-exports ~55 package-internal names because
# tests and the driver have always addressed them as `agent._foo` (its module docstring makes the
# case, and says why trimming further is risky) -- they are imports that exist to BE unused here.
"__init__.py" = ["F401"]
