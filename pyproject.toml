[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petab-mcp"
version = "0.1.0"
description = "A local MCP server for interactively editing a PEtab (v1) model/parameters and scoring against fixed data."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Fabian Fröhlich" }]
keywords = ["petab", "mcp", "systems-biology", "sbml", "parameter-estimation", "amici"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# The simulation stack (AMICI + pyPESTO) is a hard requirement: fitting and simulation
# run automatically on every model commit, so the server assumes they are present.
# Installing therefore needs a C++ toolchain, CMake/Ninja, and swig (see README).
dependencies = [
    # The MCP server framework. server.py builds on the STANDALONE `fastmcp` package -- the
    # maintained continuation of the FastMCP that once shipped inside the `mcp` SDK and was
    # removed there in mcp 2.0.0. `from fastmcp import FastMCP` replaces the old
    # `from mcp.server.fastmcp import FastMCP`; the tool/resource decorators, the
    # `FastMCP(name, instructions=...)` constructor, and `run(transport=...)` are unchanged.
    # fastmcp 3.x pulls a compatible `mcp` (1.x) in transitively, which is what the harness's MCP
    # *client* code (runner/*, bio_sessions) imports -- so no separate `mcp` pin is needed here.
    # Held below 4 deliberately: fastmcp 4.x pulls in the mcp 2.0 SDK, and the AGENT STACK cannot
    # run on mcp 2.0 yet -- `langchain-mcp-adapters` (the load_mcp_tools bridge the deepagents
    # driver needs) hard-imports the `mcp.server.fastmcp` module that mcp 2.0 deleted, in every
    # released version (through 0.3.1), so merely importing it crashes under mcp 2.0. mcp 2.0 also
    # reworks the client API the harness uses directly (streamablehttp_client -> streamable_http_client
    # with a new signature; CallToolResult/Tool fields went snake_case). Revisit once
    # langchain-mcp-adapters ships mcp 2.0 support.
    "fastmcp>=3,<4",
    "petab>=0.5",
    "python-libsbml>=5.19",
    "antimony>=2.12",
    "pandas>=1.5",
    "numpy>=1.23",
    "duckdb>=0.9",
    # Never imported here: pyPESTO's storage API writes the per-fit pypesto_result.hdf5
    # (fitting._write_result_hdf5 / provenance's copy-forward) and h5py is what it writes
    # through. Pinned explicitly so that path can't break on a transitive graph change.
    "h5py>=3",
    "sympy>=1.10",
    # Imported directly for the chi2 goodness-of-fit p-value (residual_tests, fitting) and by
    # the harness's judge. Only transitively present via pyPESTO otherwise.
    "scipy>=1.10",
    "amici>=0.30",
    "pypesto[petab]>=0.5",
    "fides>=0.7",
]

[project.optional-dependencies]
# Includes the agent stack: the harness tests drive the REAL deepagents/langchain graph (with a
# scripted fake chat model -- no network, no MCP server), and every one of them is guarded by an
# importorskip. Without these, `pip install -e '.[dev]' && pytest` silently SKIPS ~20 tests and
# reports green, which is how a broken _trim_europepmc_search and an uncurated `general-purpose`
# subagent (issue #112) each stayed invisible. Phoenix and W&B are deliberately NOT pulled in --
# no test touches them, and they are much heavier than the driver itself.
dev = [
    "pytest>=7", "pytest-asyncio>=0.23", "pytest-xdist>=3",
    # The linter CI runs (`ruff check .`, config in [tool.ruff] below). Floored at 0.6 -- the
    # version the rule set was selected against. Left UNCAPPED deliberately: a new ruff CAN add
    # rules inside the E/F/W families we select, but the resulting failure is a handful of local
    # fixes, which is cheaper than an upper bound nobody remembers to raise. If a version bump
    # ever lands a rule that is wrong FOR THIS REPO, add it to `ignore` with the reason -- do not
    # cap ruff. CI installs ruff on its own (it needs no C++ toolchain), so this pin exists so a
    # developer runs the same check locally.
    "ruff>=0.6",
    "petab-mcp[agent]",
]

# The deepagents driver stack: what the analyst panel actually runs on, and the only part of the
# harness the test suite exercises. Split out from `harness` so `dev` can depend on exactly this
# much, and so the version pins have ONE home.
agent = [
    # deepagents 0.7.x runs on the langchain 1.x line (langchain-core 1.5, langgraph 1.2), so
    # langchain-openai must also be on 1.x. create_deep_agent still exposes the
    # `system_prompt` / `subagents` / `middleware` / `checkpointer` kwargs the driver adapts to
    # (see agent/driver.py), and the SubAgent spec + HarnessProfile containment APIs
    # (agent/subagents.py) are unchanged -- so this is a pin bump, not a port.
    "deepagents==0.7.1",
    # The MCP<->langchain bridge (load_mcp_tools). Not a dependency of either package above, so
    # it has to be named: tests/test_run_loop_no_model.py's guard requires it, and without it
    # that file -- the only coverage of run_deepagents' run loop -- skips in CI too.
    "langchain-mcp-adapters==0.3.0",
    "langchain-openai>=1.3,<2",
]

# The agent harness (`petab_harness`): the deepagents driver every example's run.py drives,
# plus Phoenix tracing and W&B metrics logging. NOT needed for `--driver scripted` (the
# no-LLM harness self-test), which needs only the petab-mcp server itself, nor for
# regenerating an example's synthetic data (generate_data.py needs only amici + petab,
# which the server install already provides).
#
# Reaching a model also needs an OpenRouter API key:
#     export OPENROUTER_API_KEY=sk-or-...      # https://openrouter.ai/keys
harness = [
    "petab-mcp[agent]",
    # Arize Phoenix agent tracing (ON by default; disable at runtime with --no-phoenix).
    # Traces every LLM + MCP tool call the agent makes as OpenTelemetry spans viewable in the
    # Phoenix UI. arize-phoenix-otel + the LangChain instrumentor EXPORT the spans; the full
    # `arize-phoenix` package provides the local in-process UI the runner launches when no
    # PHOENIX_COLLECTOR_ENDPOINT is set, and >=19 provides the run_experiment / Datasets /
    # Prompt-registry API that examples/run_experiments.py uses.
    "arize-phoenix>=19.13",
    "arize-phoenix-otel>=0.16",
    "openinference-instrumentation-langchain>=0.1",
    # Weights & Biases metrics logging for the model x temperature sweep (opt-in via run.py
    # --wandb). Cluster-friendly alternative analysis UI to Phoenix Experiments; logs one
    # small W&B run per (example x model x temperature x repeat) with the judge outcome.
    # Credentials via `wandb login` (~/.netrc); `WANDB_MODE=offline` + `wandb sync` survives
    # an egress-restricted cluster.
    "wandb>=0.18",
]
# The blinded bio-knowledge analyst (`biocurator`) needs NO extra dependency here: it reaches
# the hardcoded bio-knowledge MCP endpoints (petab_harness.runner.endpoints.BIO_MCP_URLS) over
# streamable-HTTP with the langchain-mcp-adapters / mcp client already pinned above.

# Run-explorer web UI (examples/explore_ui.py): serves the archived runs + Phoenix trace.
# The Phoenix client it reads traces through ships with the `harness` extra above; these are
# just the web-serving deps.
explorer = ["fastapi>=0.110", "uvicorn>=0.23", "jinja2>=3.1"]

[project.scripts]
petab-mcp = "petab_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/ffroehlich/petab_mcp"
Repository = "https://github.com/ffroehlich/petab_mcp"

[tool.hatch.build.targets.wheel]
# petab_harness (the examples' agent harness) ships alongside the server rather than as its
# own distribution: it is only ever installed next to petab_mcp, from this repo.
packages = ["src/petab_mcp", "src/petab_harness"]

[tool.hatch.build.targets.sdist]
include = ["src/petab_mcp", "src/petab_harness", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
# NO `-n` here, deliberately. Parallelism is requested by the CALLER (`.github/workflows/ci.yml`
# passes `-n 2` for the 2-core runner) rather than baked into every invocation, because in addopts
# it cost more than it bought locally: it made pytest-xdist a HARD dependency (bare `pytest` exits
# 4 on the unrecognised argument before collecting anything), it breaks `--pdb`, and it made even
# `pytest tests/test_model_edits.py` spawn two workers.
#
# That last one is the expensive part, and the reason the scaling is poor in general: 8 workers cut
# the full suite from 662s to 306s, only 2.2x. `conftest.amici_build_root` is session-scoped, so
# ONE AMICI build root is shared and the toy model compiles once (~60-90s) -- but under xdist each
# worker is its own process with its own root, so that compile is paid PER WORKER and eats most of
# what the parallelism buys. Raising the worker count mostly buys more compiles; a single-file
# debug run paid it twice for no parallelism at all. Making it scale means sharing one root across
# workers behind a file lock, which is a real change, not a flag.

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately NARROW. This linter was configured onto a ~53k-line codebase that had never run
# one, so the rule set is what the code ALREADY satisfies (plus the ~20 real defects fixed in the
# same change) rather than what a greenfield project would pick. Widening is a separate change per
# family, each with its own diff -- see docs/STYLE_GUIDE.md for the ones deliberately left out
# (`I`, `UP`, `BLE`, and `ruff format`, which would destroy load-bearing manual alignment).
select = ["E", "F", "W"]
ignore = [
    # Line length is a ~100-col TARGET, not a gate. ~640 lines in `src/` exceed it and nearly all
    # of them are the rationale comments that carry this repo's institutional memory; reflowing
    # them would churn `git blame` across every module to buy nothing. Write to 100 anyway.
    "E501",
    # `p = m.createParameter(); p.setId(sid); p.setConstant(True)` -- semicolon-joined statements
    # are a deliberate idiom here for a run of trivial setter calls on one object (libsbml
    # construction, matplotlib axis setup, PEtab row assembly). 19 sites, all intentional.
    "E702",
]

[tool.ruff.lint.per-file-ignores]
# Package facades. `petab_harness/agent/__init__.py` re-exports ~55 package-internal names because
# tests and the driver have always addressed them as `agent._foo` (its module docstring makes the
# case, and says why trimming further is risky) -- they are imports that exist to BE unused here.
# `petab_mcp/__init__.py` sequences its imports around a package-level side effect
# (`antimony_guard.install()` must run before `.session` is imported), which is what E402 flags.
"__init__.py" = ["F401", "E402"]
