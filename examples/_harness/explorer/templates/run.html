<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>petab-mcp · run</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar" id="run-header">
    <div class="hleft">
      <a class="back" href="/">← runs</a>
      <h1 id="run-title">loading…</h1>
    </div>
    <div id="run-badges" class="badges"></div>
  </header>

  <div id="phoenix-note" class="banner" hidden></div>

  <main class="run-layout">
    <!-- scrollable conversation -->
    <section id="stream" class="stream" aria-label="conversation"></section>

    <!-- always-visible model-variant + score panel -->
    <aside class="sidepanel">
      <div class="chart-card">
        <div class="chart-head">
          <span>score over model variants</span>
          <span class="toggle" id="metric-toggle" role="group" aria-label="metric">
            <button data-metric="bic" class="on">ΔBIC</button><button data-metric="nll">nll</button>
          </span>
        </div>
        <div id="chart"></div>
        <div class="chart-legend muted" id="chart-legend"></div>
      </div>
      <div id="variant-card" class="variant-card"></div>
    </aside>
  </main>

  <script>window.RUN_ID = {{ run_id | tojson }};</script>
  <script src="/static/app.js"></script>
</body>
</html>
