name: Release

# A published GitHub release uploads gemot to PyPI; a manual run uploads it to TestPyPI. Both
# upload by trusted publishing: PyPI and TestPyPI each trust this file in the `pypi` environment,
# and no token is stored. The version is `[project] version` in pyproject.toml, and a release's tag
# is `v<version>`. PyPI refuses a version it already has.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      # --strict also fails on a metadata warning. hatchling itself refuses a direct reference in
      # `dependencies` or an extra (no `allow-direct-references`), which PyPI would refuse anyway.
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ github.event_name == 'release' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
