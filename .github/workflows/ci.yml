name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:        # run required checks on the merge-queue ref (else the queue stalls)
  workflow_dispatch:

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result even if one fails.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # pip keys the AMICI wheel it builds on the sdist's URL alone, and setup-python's own cache
      # restores any older cache of this Python by prefix: an AMICI built against the HDF5 this job
      # installed before PEtab-MCP#222 then failed to import (`libhdf5_serial_hl.so.100`). So this
      # prefix names the toolchain below, as petab-mcp's CI does. Change "ninja" when that
      # toolchain changes.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-ninja-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-ninja-${{ runner.os }}-py${{ matrix.python-version }}-

      # AMICI generates and compiles C++ for every model, and is itself built
      # from source here: its release is an sdist (pyproject.toml); its build
      # pulls BLAS from the scipy-openblas64 wheel. A C/C++ compiler and CMake
      # ship on ubuntu-latest; the Ninja generator AMICI drives CMake with does
      # not, so install it.
      #
      # No HDF5: AMICI >= 1.2.0 pickles a solver as a dict of its settings, so a
      # fit start reaches a worker without it, and petab-mcp's CI dropped it
      # (PEtab-MCP#222). pyPESTO's result file is written by h5py, whose wheel
      # brings its own.
      #
      # Deliberately NOT installing the apt `swig`: AMICI is built against the
      # pip `swig`, and a mismatched system SWIG makes compiled models raise
      # "'SwigPyObject' object has no attribute 'module'". The matching SWIG is
      # the pip `swig` package (installed and pinned below).
      - name: Install build toolchain (Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake build-essential

      # tests/test_sandbox.py runs the barebones agent's shell under bubblewrap and checks what it
      # must not reach (the example directory above the workspace, $HOME, the network, the
      # harness source). Those tests skip where bwrap is absent, but not under CI: there a missing
      # or broken bwrap FAILS them, so this step is what keeps them running rather than skipped.
      # Ubuntu 24.04 lets an unprivileged process create a user namespace only under an AppArmor
      # profile that strips its capabilities, and bwrap cannot build a sandbox in one; lift that
      # restriction on this throwaway VM, as `sandbox_preflight` requires of every node that runs
      # an agent shell. The last line proves a sandbox starts before any test relies on it.
      - name: Install bubblewrap (the agent shell's sandbox)
        run: |
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --proc /proc --dev /dev true

      # AMICI's source build compiles serially unless told otherwise; the pip
      # cache keeps the built wheel for the pinned commit.
      # `--group pins` adds the unreleased commits PyPI refuses as dependencies (pyproject.toml's
      # `pins` group: petab, pysb, petab-sciml); without the pysb one `[dev]`'s `statements` extra
      # does not resolve. Dependency groups need pip >= 25.1, hence the upgrade first.
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          AMICI_PARALLEL_COMPILE=$(nproc) python -m pip install -e '.[dev]' --group pins

      # NOTE: the deepagents driver's tests (test_subagent_registry.py, test_agent_tool_dispatch.py,
      # test_biocurator_input.py, test_biocurator_trim.py) importorskip their harness dependency, so
      # they SILENTLY SKIP if it is absent -- which is how a broken _trim_europepmc_search and,
      # before it, the uncurated `general-purpose` subagent (issue #112) stayed invisible to CI.
      # `.[dev]` above covers them: dev -> gemot[agent], which pins deepagents,
      # langchain-openai AND langchain[mcp], the tool bridge. Do not add a manual install step back
      # -- the one removed here omitted the bridge (then langchain-mcp-adapters), so it was strictly
      # weaker than the extra it duplicated, and it could drift out of step with the pins in
      # pyproject.toml.

      # `swig` is an (unpinned) AMICI dependency, so `.[dev]` already pulls it;
      # install it explicitly too so CI never silently relies on the transitive
      # graph. Its version tracks the SWIG AMICI is built against, which is
      # what compiled models must match.
      - name: Install the SWIG that matches the AMICI build
        run: python -m pip install swig

      # Point AMICI's per-model CMake build at that pip `swig`, overriding any
      # SWIG pre-installed on the runner. AMICI honours $SWIG / $SWIG_LIB in the
      # generated model's CMakeLists. Both are resolved from the installed
      # package (its bundled data/bin/swig reports a stale -swiglib, so SWIG_LIB
      # must be set explicitly). No system-SWIG fallback: the job fails loudly if
      # the package binary is missing rather than compiling against a mismatched
      # SWIG.
      - name: Pin SWIG to the AMICI-matching build
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import pathlib, sys, swig
          data = pathlib.Path(swig.__file__).resolve().parent / "data"
          swig_bin = data / "bin" / "swig"
          lib_dirs = sorted(p for p in (data / "share" / "swig").iterdir() if p.is_dir())
          if not swig_bin.is_file() or not lib_dirs:
              sys.exit(f"pip `swig` package is missing its bundled binary/library: {swig_bin}, {lib_dirs}")
          print(f"SWIG={swig_bin}")
          print(f"SWIG_LIB={lib_dirs[-1]}")
          PY

      # tests/test_explorer_math.py runs the explorer's LaTeX->MathML converter in `node` (app.js
      # is a plain browser script, so the only way to test it is to evaluate it). That test skips
      # where node is absent; pin one here so the skip never happens silently in CI, for the same
      # reason the SWIG install above is explicit.
      - name: Set up Node (runs the explorer's JS through pytest)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        # -n 2 lives HERE, not in pyproject's addopts, so it applies to CI (a 2-core runner)
        # without taxing every local invocation: in addopts it made pytest-xdist a hard
        # dependency (bare pytest exits 4 on the unrecognised argument), broke --pdb, and made
        # even a single-file debug run spawn two workers -- each with its own session-scoped
        # amici_build_root, so the ~60-90s toy-model compile was paid twice for no parallelism.
        run: python -m pytest -v -n 2

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Deliberately NOT `pip install -e '.[dev]'`. The `test` job above spends minutes on the
      # AMICI/C++ toolchain (compiler, CMake, Ninja, the pinned pip SWIG) because it has to
      # COMPILE models; a linter parses Python and needs none of it. Installing ruff alone keeps
      # this job at a few seconds, so a style slip is reported long before the test matrix
      # finishes. The floor matches the `dev` extra's `ruff>=0.6` -- the version [tool.ruff]'s
      # rule set was selected against -- so a local `ruff check .` and this job agree.
      - name: Install ruff
        run: python -m pip install --upgrade 'ruff>=0.6'

      # Config (rule set, ignores, per-file exemptions, and the reason for each) is in
      # pyproject.toml's [tool.ruff]; the rationale for what is deliberately NOT selected is in
      # docs/STYLE_GUIDE.md.
      - name: Run ruff
        run: ruff check --output-format=github .
